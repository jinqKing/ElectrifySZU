<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="3;url=https://www.iotun.com/">
  <title>ElectrifySZU 已迁移至 IoTUN</title>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color-scheme:light dark;
      --bg:#f6f7f9;--card:rgba(255,255,255,.88);--text:#17191d;--muted:#6b7280;
      --accent:#2563eb;--border:rgba(17,24,39,.08)
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#0f1115;--card:rgba(28,31,38,.9);--text:#f4f4f5;--muted:#a1a1aa;--accent:#60a5fa;--border:rgba(255,255,255,.1)}
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);
      background:
        radial-gradient(circle at 20% 20%,rgba(37,99,235,.12),transparent 34%),
        radial-gradient(circle at 80% 75%,rgba(14,165,233,.10),transparent 30%),
        var(--bg)
    }
    main{
      width:min(100%,520px);padding:36px 30px;border:1px solid var(--border);border-radius:24px;
      background:var(--card);box-shadow:0 24px 70px rgba(0,0,0,.10);backdrop-filter:blur(18px);text-align:center
    }
    .icon{
      width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;
      font-size:32px;background:rgba(37,99,235,.10)
    }
    h1{margin:0 0 12px;font-size:clamp(24px,6vw,32px);line-height:1.2}
    p{margin:0 auto;max-width:420px;color:var(--muted);line-height:1.75}
    .countdown{margin:18px 0 24px;font-size:14px;color:var(--muted)}
    .countdown strong{color:var(--text);font-variant-numeric:tabular-nums}
    .button{
      display:block;width:100%;padding:14px 18px;border-radius:14px;background:var(--accent);
      color:#fff;text-decoration:none;font-weight:650;transition:transform .15s ease,opacity .15s ease
    }
    .button:active{transform:scale(.985)}
    .url{margin-top:16px;font-size:13px}
    .url a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⚡</div>
    <h1>ElectrifySZU 已迁移</h1>
    <p>电费查询与提醒服务现已由 <strong>IoTUN</strong> 提供。你将自动前往新的服务页面。</p>
    <div class="countdown"><strong id="seconds">3</strong> 秒后自动跳转</div>
    <a class="button" href="https://www.iotun.com/">立即前往 IoTUN</a>
    <p class="url">如果没有自动跳转，请访问 <a href="https://www.iotun.com/">iotun.com</a></p>
  </main>
  <script>
    (() => {
      const target = 'https://www.iotun.com/';
      const el = document.getElementById('seconds');
      let seconds = 3;
      const timer = setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.replace(target);
          return;
        }
        el.textContent = String(seconds);
      }, 1000);
    })();
  </script>
</body>
</html>
